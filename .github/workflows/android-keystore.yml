name: 生成安卓签名密钥（只需运行一次）

# 在 GitHub 云端生成固定的签名密钥，直接写入仓库 Secrets（全程不在日志里显示）。
# 需要先在 Secrets 里放两项：
#   GH_ADMIN_TOKEN        —— 有本仓库 “Secrets 读写” 权限的细粒度个人令牌
#   KEY_BACKUP_PASSPHRASE —— 你自己记住的备份口令（用于加密密钥备份文件）
# 已有密钥时会拒绝覆盖：换了密钥，之前装过的 App 就无法再覆盖升级。
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 检查前置条件
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          PASS: ${{ secrets.KEY_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::缺少 GH_ADMIN_TOKEN Secret"; exit 1; fi
          if [ ${#PASS} -lt 8 ]; then echo "::error::KEY_BACKUP_PASSPHRASE 缺失或少于 8 位"; exit 1; fi
          if gh secret list -R "$GITHUB_REPOSITORY" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            echo "::error::仓库里已经有签名密钥，为了保护已安装的 App 能继续升级，拒绝覆盖。"; exit 1
          fi
      - name: 生成密钥并写入 Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          PASS: ${{ secrets.KEY_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          KS_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -v -storetype PKCS12 -keystore release.jks -alias sudoku \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Sudoku PWA, O=bencongtang673-beep, C=CN" >/dev/null 2>&1
          base64 -w0 release.jks > release.b64
          gh secret set ANDROID_KEYSTORE_BASE64 -R "$GITHUB_REPOSITORY" < release.b64
          printf '%s' "$KS_PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD -R "$GITHUB_REPOSITORY"
          printf '%s' "$KS_PASS" | gh secret set ANDROID_KEY_PASSWORD -R "$GITHUB_REPOSITORY"
          printf 'sudoku' | gh secret set ANDROID_KEY_ALIAS -R "$GITHUB_REPOSITORY"
          # 加密备份（用你的备份口令加密；解密：openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore-backup.enc -out bundle.txt）
          { echo "alias=sudoku"; echo "password=$KS_PASS"; echo "keystore_base64=$(cat release.b64)"; } > bundle.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in bundle.txt -out keystore-backup.enc -pass env:PASS
          keytool -list -keystore release.jks -storepass "$KS_PASS" | grep -i 'SHA-256' || true
          rm -f release.jks release.b64 bundle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: keystore-backup.enc
          retention-days: 90
